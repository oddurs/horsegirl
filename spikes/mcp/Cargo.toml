[package]
name = "horsegirl-mcp-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway prototype for SPIKE-21: one MCP tool over stdio."

# An empty workspace keeps this prototype out of the horsegirl crate and out of
# scripts/task. Build it from this directory.
[workspace]

[dependencies]
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
