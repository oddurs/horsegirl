[package]
name = "horsegirl"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
description = "An agent-first diagram language: state the facts once, choose a lens."
license = "MIT"
repository = "https://github.com/oddurs/horsegirl"
readme = "README.md"
keywords = ["diagram", "diagrams-as-code", "visualization", "agents"]
categories = ["command-line-utilities", "visualization"]
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
