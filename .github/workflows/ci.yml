name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CAIRN_VERSION: 1.0.0-alpha.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the backlog tool
        if: hashFiles('cairn.toml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="cairn-${CAIRN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          dir="$(mktemp -d)"
          gh release download "v${CAIRN_VERSION}" --repo oddurs/cairn --dir "$dir" \
            --pattern "$asset" --pattern SHA256SUMS
          (cd "$dir" && grep " $asset\$" SHA256SUMS | sha256sum --check -)
          tar -xzf "$dir/$asset" -C "$dir"
          install -m 755 "$(find "$dir" -type f -name cairn)" /usr/local/bin/cairn
          cairn --version
      # The site verbs in scripts/task need the pinned Node and pnpm.
      - name: Install pnpm
        if: hashFiles('site/package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - name: Install Node
        if: hashFiles('site/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: scripts/task check
      # scripts/task check builds site/out. Every run keeps it as an artifact,
      # and the deploy job publishes the one from a push to main.
      - name: Upload the site
        if: hashFiles('site/out/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  # Not in `required`: a pull request skips it. The check job already builds
  # the site, so `required` covers the build.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    # Pages needs these two scopes and nothing else.
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The job always runs, so `required` never sees it as skipped on a push.
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the title and the body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-pr-title

  required:
    if: always()
    needs: [check, pr-title]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
