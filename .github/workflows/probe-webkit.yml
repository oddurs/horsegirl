name: probe-webkit
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engines: chromium,firefox,webkit
          - os: macos-latest
            engines: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.65.1
        working-directory: probe
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: probe
      - run: node measure.mjs
        working-directory: probe
        env:
          ENGINES: ${{ matrix.engines }}
