version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    # The types follow the Node major in site/.node-version; a newer major
    # would allow APIs that the runtime does not have.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
    groups:
      site:
        update-types: [minor, patch]
