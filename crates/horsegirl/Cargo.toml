[package]
name = "horsegirl"
description = "An agent-first diagram language: state the facts once, choose a lens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["diagram", "diagrams-as-code", "visualization", "agents"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
horsegirl-core = { path = "../horsegirl-core" }
# The MCP server. SPIKE-21 chose rmcp and pins it exactly: its tool shapes are
# a public contract. rmcp brings schemars, which derives the tool schemas.
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt"] }

[lints]
workspace = true
